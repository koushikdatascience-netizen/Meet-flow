{% extends 'inventory/base.html' %}{% block content %}<a class="back-link" href="{% url 'home' %}">← Back</a><h2>Delete {{ entry.get_kind_display }} #{{ entry.pk }}?</h2><div class="panel form-panel">{% for line in entry.lines.all %}<p><strong>{{ line.item.name }} — {{ line.quantity|floatformat:"-3" }} Pieces</strong></p>{% endfor %}<p>Stock will be updated.</p><form method="post">{% csrf_token %}<div class="entry-actions"><button>Yes, delete</button><a class="button secondary" href="{% url 'stock_entries' entry.kind %}">Cancel</a></div></form></div>{% endblock %}
