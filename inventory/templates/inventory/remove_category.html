{% extends 'inventory/base.html' %}{% block content %}<a class="back-link" href="{% url 'stock_categories' %}">← Categories</a><h2>Delete {{ category.name }}?</h2><div class="panel form-panel">{% if item_count %}<p>Move {{ item_count }} item{{ item_count|pluralize }} to another category first, including removed items.</p><a class="button" href="{% url 'stock_items' %}?removed=1&category={{ category.name|urlencode }}">Items</a>{% else %}<form method="post">{% csrf_token %}<div class="entry-actions"><button>Yes, delete</button><a class="button secondary" href="{% url 'stock_categories' %}">Cancel</a></div></form>{% endif %}</div>{% endblock %}
