{% extends 'inventory/base.html' %}{% block content %}<a class="back-link" href="{% url 'home' %}">← Back to workspace</a><h2>Companies</h2><p>Each company has separate stock, users and reports. Company administrators manage their own team.</p><form method="post" class="panel form-panel">{% csrf_token %}<label>Company name<input name="name" maxlength="160" required></label><label>Admin username<input name="username" autocomplete="off" required></label><label>Temporary password<input name="password" type="password" autocomplete="new-password" required></label><button>Create company and admin</button></form><ul>{% for company in companies %}<li><form method="post" class="form-panel">{% csrf_token %}<input type="hidden" name="company_id" value="{{ company.pk }}"><input name="name" value="{{ company.name }}" required><label><input type="checkbox" name="active" {% if company.active %}checked{% endif %}>Active</label><button>Update company</button></form></li>{% endfor %}</ul>{% endblock %}
