services:
 app:
  environment:
   DJANGO_DEBUG: '0'
   DJANGO_TRUST_PROXY: '1'
   DJANGO_SSL_REDIRECT: '1'
   DJANGO_HSTS_SECONDS: '31536000'
 web:
  ports: !override
   - '80:80'
   - '443:443'
  volumes:
   - ./deploy/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
   - ${TLS_CERT_DIR:?Set TLS_CERT_DIR to the directory containing fullchain.pem and privkey.pem}:/certs:ro
