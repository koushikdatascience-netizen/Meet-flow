services:
 db:
  image: postgres:16
  environment:
   POSTGRES_DB: ${POSTGRES_DB}
   POSTGRES_USER: ${POSTGRES_USER}
   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  healthcheck:
   test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
   interval: 5s
   timeout: 5s
   retries: 12
  volumes:
   - postgres_data:/var/lib/postgresql/data
 app:
  build: .
  env_file: .env
  depends_on:
   db:
    condition: service_healthy
  healthcheck:
   test: ['CMD', 'python', '/app/deploy/healthcheck.py']
   interval: 10s
   timeout: 5s
   retries: 12
  volumes:
   - media_data:/app/media
   - static_data:/app/staticfiles
 web:
  image: nginx:stable-alpine
  ports:
   - '127.0.0.1:8000:80'
  depends_on:
   app:
    condition: service_healthy
  volumes:
   - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
   - static_data:/static:ro
   - media_data:/media:ro
 backups:
  build: .
  profiles: ['backups']
  env_file: .env
  environment:
   BACKUP_DIR: /backups
  command: ['python','manage.py','backup_loop','--interval-hours','24']
  restart: on-failure
  depends_on:
   db:
    condition: service_healthy
  volumes:
   - media_data:/app/media:ro
   - ${BACKUP_HOST_DIR:-./backups}:/backups
volumes:
 postgres_data:
 media_data:
 static_data:
